<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <form action="post">
        <div>
            <label for="u1">Username</label>
            <input type="text" id="u1" name="username" placeholder="Enter your name" autofocus>
        </div>

        <div>
            <label for="r1">Male</label>
            <input type="radio" id="r1" name="gender" value="Male">

            <label for="r2">Female</label>
            <input type="radio" id="r2" name="gender" value="Female">
        </div>

        <div>
            <input type="checkbox" id="s1" name="sub" value="yes">
            <label for="s1">Subscribe</label>
        </div>

        <div>
            <label for="t1">Enter your comment</label><br>
            <textarea id="t1" name="comment" rows="2" cols="50"></textarea>
        </div>

        <div>
            <label for="s1">Fruit</label>
            <select id="s1" name="Fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="orange">Orange</option>
            </select>
        </div>
    </form>
</body>

</html>
