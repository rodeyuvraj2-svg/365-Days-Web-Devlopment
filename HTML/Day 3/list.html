<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Unordered List</h1>
    <ul type ="square">
        <li>Noob</li>
        <li>Average</li>
        <li>Pro</li>
        <li>Legend</li>
    </ul>
    
    <h1>Ordered List</h1>
    <ol>
        <li>Noob</li>
        <li>Average</li>
        <li>Pro</li>
        <li>Legend</li>
    </ol>

    <h1>Defination List</h1>
    <dl>
        <dt>Noob</dt>
        <dd>Tyala kahich yet nahi</dd>

        <dt>Average</dt>
        <dd>yeta pn bot ahe</dd>

        <dt>Pro</dt>
        <dd>yeta bhai la kantala ahe</dd>

        <dt>Legend</dt>
        <dd>Kidde</dd>
    </dl>
</body>
</html>
